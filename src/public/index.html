<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ApiPeru Proxy — Consola</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #181b24;
    --surface2: #1e2130;
    --border: #2a2f45;
    --accent: #5b6ef5;
    --accent-dim: #3b4bbd;
    --text: #e8eaf0;
    --muted: #7a80a0;
    --success: #22c55e;
    --danger: #f87171;
    --warning: #fbbf24;
    --radius: 10px;
    --mono: 'JetBrains Mono', 'Fira Code', monospace;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 1rem 2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 0.75rem;
    background: var(--surface);
  }

  .logo {
    width: 32px; height: 32px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700; color: #fff;
  }

  header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
  header span { font-size: 13px; color: var(--muted); margin-left: auto; }

  .layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    flex: 1;
    height: calc(100vh - 57px);
  }

  .panel {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    overflow-y: auto;
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  /* Toggle tipo */
  .type-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--bg);
    border-radius: var(--radius);
    padding: 4px;
    border: 1px solid var(--border);
  }

  .type-toggle input { display: none; }

  .type-toggle label {
    padding: 0.5rem;
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .type-toggle input:checked + label {
    background: var(--accent);
    color: #fff;
  }

  /* Inputs */
  .input-group { display: flex; flex-direction: column; gap: 0.4rem; }
  .input-group label { font-size: 12px; color: var(--muted); font-weight: 500; }

  input[type="text"], input[type="email"], input[type="password"] {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem 0.85rem;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }

  input:focus { border-color: var(--accent); }

  input[type="text"]#numero { font-family: var(--mono); font-size: 15px; letter-spacing: 0.05em; }

  /* Botones */
  .btn {
    padding: 0.65rem 1.25rem;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    width: 100%;
    font-size: 14px;
    padding: 0.75rem;
  }

  .btn-primary:hover { background: var(--accent-dim); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    font-size: 12px;
    padding: 0.4rem 0.75rem;
  }

  .btn-ghost:hover { border-color: var(--muted); color: var(--text); }

  /* Auth section */
  .auth-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .auth-status {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 12px;
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--danger);
    flex-shrink: 0;
  }

  .dot.ok { background: var(--success); }

  .token-preview {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    background: var(--bg);
    padding: 0.4rem 0.6rem;
    border-radius: 6px;
    word-break: break-all;
    display: none;
  }

  /* Divider */
  .divider {
    border: none;
    border-top: 1px solid var(--border);
  }

  /* Panel resultado */
  .result-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .result-toolbar {
    padding: 0.75rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 0.75rem;
    background: var(--surface);
    min-height: 49px;
  }

  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 5px;
    letter-spacing: 0.04em;
  }

  .badge-cache { background: #1a3a2a; color: var(--success); }
  .badge-api   { background: #2a1a3a; color: #c084fc; }
  .badge-error { background: #3a1a1a; color: var(--danger); }
  .badge-time  { background: var(--surface2); color: var(--muted); margin-left: auto; }

  .result-body {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 0.75rem;
    color: var(--muted);
  }

  .empty-icon {
    font-size: 48px;
    opacity: 0.2;
  }

  .empty-state p { font-size: 14px; }

  pre {
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--text);
  }

  /* Syntax highlight colores */
  .k { color: #c084fc; }   /* keys */
  .s { color: #86efac; }   /* strings */
  .n { color: #fbbf24; }   /* numbers */
  .b { color: #60a5fa; }   /* booleans */
  .nl { color: var(--muted); } /* null */

  /* History */
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    max-height: 160px;
    overflow-y: auto;
  }

  .history-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem 0.6rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    transition: background 0.1s;
    background: var(--surface2);
    border: 1px solid var(--border);
  }

  .history-item:hover { border-color: var(--accent); }
  .history-item .ht { font-family: var(--mono); font-weight: 600; color: var(--text); }
  .history-item .htype { font-size: 10px; color: var(--muted); background: var(--bg); padding: 1px 5px; border-radius: 4px; }
  .history-item .hfuente { margin-left: auto; font-size: 10px; }
  .cache-dot { color: var(--success); }
  .api-dot { color: #c084fc; }

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    display: none;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="logo">A</div>
  <h1>ApiPeru Proxy — Consola</h1>
  <span id="env-badge">localhost:3000</span>
</header>

<div class="layout">

  <!-- Panel izquierdo -->
  <aside class="panel">

    <!-- Auth -->
    <div>
      <p class="section-label">Autenticación</p>
      <div class="auth-card">
        <div class="auth-status">
          <div class="dot" id="auth-dot"></div>
          <span id="auth-label">Sin sesión</span>
          <button class="btn btn-ghost" id="btn-logout" style="margin-left:auto;display:none" onclick="logout()">Salir</button>
        </div>
        <div class="token-preview" id="token-preview"></div>

        <div class="input-group" id="auth-form">
          <label>Email</label>
          <input type="email" id="auth-email" placeholder="admin@tudominio.com" />
          <label>Password</label>
          <input type="password" id="auth-pass" placeholder="••••••••" />
          <button class="btn btn-primary" style="margin-top:0.25rem" onclick="doLogin()">Iniciar sesión</button>
        </div>
      </div>
    </div>

    <hr class="divider" />

    <!-- Tipo de consulta -->
    <div>
      <p class="section-label">Tipo de consulta</p>
      <div class="type-toggle">
        <input type="radio" name="tipo" id="tipo-ruc" value="ruc" checked />
        <label for="tipo-ruc">🏢 RUC</label>
        <input type="radio" name="tipo" id="tipo-dni" value="dni" />
        <label for="tipo-dni">🪪 DNI</label>
      </div>
    </div>

    <!-- Número -->
    <div class="input-group">
      <label id="numero-label">Número de RUC (11 dígitos)</label>
      <input type="text" id="numero" placeholder="20100070970" maxlength="11" inputmode="numeric" />
    </div>

    <button class="btn btn-primary" id="btn-consultar" onclick="consultar()">
      <div class="spinner" id="spinner"></div>
      <span id="btn-text">Consultar</span>
    </button>

    <hr class="divider" />

    <!-- Historial -->
    <div>
      <p class="section-label">Historial</p>
      <div class="history-list" id="history-list">
        <p style="font-size:12px;color:var(--muted)">Las consultas aparecerán aquí.</p>
      </div>
    </div>

  </aside>

  <!-- Panel resultado -->
  <main class="result-panel">
    <div class="result-toolbar">
      <span id="result-badge"></span>
      <span id="result-endpoint" style="font-size:12px;color:var(--muted);font-family:var(--mono)"></span>
      <span class="badge badge-time" id="result-time" style="display:none"></span>
    </div>
    <div class="result-body" id="result-body">
      <div class="empty-state">
        <div class="empty-icon">⚡</div>
        <p>Inicia sesión y realiza una consulta</p>
      </div>
    </div>
  </main>

</div>

<script>
let token = localStorage.getItem('proxy_token') || '';
let history = JSON.parse(localStorage.getItem('proxy_history') || '[]');

const BASE = '';

// ── Init ──────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  if (token) showLoggedIn(JSON.parse(atob(token.split('.')[1])));
  renderHistory();

  document.querySelectorAll('input[name="tipo"]').forEach(r => {
    r.addEventListener('change', () => {
      const ruc = r.value === 'ruc';
      document.getElementById('numero-label').textContent = ruc
        ? 'Número de RUC (11 dígitos)'
        : 'Número de DNI (8 dígitos)';
      document.getElementById('numero').placeholder = ruc ? '20100070970' : '12345678';
      document.getElementById('numero').maxLength = ruc ? 11 : 8;
      document.getElementById('numero').value = '';
    });
  });

  document.getElementById('numero').addEventListener('keydown', e => {
    if (e.key === 'Enter') consultar();
  });
  document.getElementById('auth-pass').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
});

// ── Auth ──────────────────────────────────────────────────
async function doLogin() {
  const email = document.getElementById('auth-email').value.trim();
  const pass  = document.getElementById('auth-pass').value;
  if (!email || !pass) return showToast('Completa email y password', 'error');

  try {
    const res  = await fetch(`${BASE}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pass }),
    });
    const data = await res.json();
    if (!data.ok) return showToast(data.mensaje, 'error');

    token = data.token;
    localStorage.setItem('proxy_token', token);
    showLoggedIn(data.usuario);
    showToast('Sesión iniciada ✓', 'ok');
  } catch (e) {
    showToast('Error de red: ' + e.message, 'error');
  }
}

function showLoggedIn(usuario) {
  document.getElementById('auth-dot').classList.add('ok');
  document.getElementById('auth-label').textContent = usuario.nombre || usuario.email;
  document.getElementById('auth-form').style.display = 'none';
  document.getElementById('btn-logout').style.display = 'inline-flex';
  const preview = document.getElementById('token-preview');
  preview.style.display = 'block';
  preview.textContent = token.slice(0, 40) + '…';
}

function logout() {
  token = '';
  localStorage.removeItem('proxy_token');
  document.getElementById('auth-dot').classList.remove('ok');
  document.getElementById('auth-label').textContent = 'Sin sesión';
  document.getElementById('auth-form').style.display = 'flex';
  document.getElementById('btn-logout').style.display = 'none';
  document.getElementById('token-preview').style.display = 'none';
  showToast('Sesión cerrada', 'ok');
}

// ── Consulta ──────────────────────────────────────────────
async function consultar() {
  if (!token) return showToast('Inicia sesión primero', 'error');
  const tipo   = document.querySelector('input[name="tipo"]:checked').value;
  const numero = document.getElementById('numero').value.trim();
  if (!numero) return showToast('Ingresa un número', 'error');

  setLoading(true);
  const t0 = Date.now();

  try {
    const res  = await fetch(`${BASE}/api/${tipo}/${numero}`, {
      headers: { 'Authorization': `Bearer ${token}` },
    });
    const data = await res.json();
    const ms   = Date.now() - t0;

    renderResult(data, tipo, numero, ms, res.status);
    if (data.ok) addHistory(tipo, numero, data.fuente);
  } catch (e) {
    renderError(e.message);
  } finally {
    setLoading(false);
  }
}

function setLoading(on) {
  document.getElementById('btn-consultar').disabled = on;
  document.getElementById('spinner').style.display  = on ? 'block' : 'none';
  document.getElementById('btn-text').textContent   = on ? 'Consultando…' : 'Consultar';
}

// ── Render resultado ──────────────────────────────────────
function renderResult(data, tipo, numero, ms, status) {
  const badge    = document.getElementById('result-badge');
  const endpoint = document.getElementById('result-endpoint');
  const timer    = document.getElementById('result-time');
  const body     = document.getElementById('result-body');

  endpoint.textContent = `GET /api/${tipo}/${numero}`;
  timer.style.display  = 'inline-block';
  timer.textContent    = `${ms} ms · HTTP ${status}`;

  if (data.ok) {
    const fuente = data.fuente;
    badge.className = 'badge ' + (fuente === 'cache' ? 'badge-cache' : 'badge-api');
    badge.textContent = fuente === 'cache' ? '✓ CACHE' : '⚡ API';
  } else {
    badge.className   = 'badge badge-error';
    badge.textContent = '✕ ERROR';
  }

  body.innerHTML = `<pre>${syntaxHighlight(data)}</pre>`;
}

function renderError(msg) {
  document.getElementById('result-badge').className = 'badge badge-error';
  document.getElementById('result-badge').textContent = '✕ ERROR';
  document.getElementById('result-body').innerHTML =
    `<pre style="color:var(--danger)">${msg}</pre>`;
}

function syntaxHighlight(obj) {
  const json = JSON.stringify(obj, null, 2);
  return json.replace(
    /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
    match => {
      if (/^"/.test(match)) {
        if (/:$/.test(match)) return `<span class="k">${match}</span>`;
        return `<span class="s">${match}</span>`;
      }
      if (/true|false/.test(match)) return `<span class="b">${match}</span>`;
      if (/null/.test(match))       return `<span class="nl">${match}</span>`;
      return `<span class="n">${match}</span>`;
    }
  );
}

// ── Historial ─────────────────────────────────────────────
function addHistory(tipo, numero, fuente) {
  history.unshift({ tipo, numero, fuente, ts: Date.now() });
  if (history.length > 20) history.pop();
  localStorage.setItem('proxy_history', JSON.stringify(history));
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById('history-list');
  if (!history.length) {
    list.innerHTML = '<p style="font-size:12px;color:var(--muted)">Las consultas aparecerán aquí.</p>';
    return;
  }
  list.innerHTML = history.map((h, i) => `
    <div class="history-item" onclick="loadHistory(${i})">
      <span class="htype">${h.tipo.toUpperCase()}</span>
      <span class="ht">${h.numero}</span>
      <span class="hfuente ${h.fuente === 'cache' ? 'cache-dot' : 'api-dot'}">
        ${h.fuente === 'cache' ? '● cache' : '● api'}
      </span>
    </div>
  `).join('');
}

function loadHistory(i) {
  const h = history[i];
  document.getElementById(`tipo-${h.tipo}`).checked = true;
  document.querySelector('input[name="tipo"]:checked').dispatchEvent(new Event('change'));
  document.getElementById('numero').value = h.numero;
}

// ── Toast ─────────────────────────────────────────────────
function showToast(msg, type) {
  const t = document.createElement('div');
  t.textContent = msg;
  Object.assign(t.style, {
    position: 'fixed', bottom: '1.5rem', right: '1.5rem',
    background: type === 'ok' ? '#14532d' : '#450a0a',
    color: type === 'ok' ? '#86efac' : '#fca5a5',
    border: `1px solid ${type === 'ok' ? '#166534' : '#991b1b'}`,
    padding: '0.65rem 1rem', borderRadius: '8px',
    fontSize: '13px', fontWeight: '500',
    zIndex: 9999, transition: 'opacity 0.3s',
  });
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2500);
}
</script>

</body>
</html>
